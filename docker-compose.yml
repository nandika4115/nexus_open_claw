version: "3.9"
services:
  mnemochron-core:
    build: .
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - mnemochron_memory:/root/.mnemochron
  mnemochron:
    image: node:20
    container_name: mnemochron
    volumes:
      - ./:/usr/src/app
      - mnemochron_memory:/root/.mnemochron
    restart: unless-stopped
    ports:
      - "8080:8080"
volumes:
  mnemochron_memory:
